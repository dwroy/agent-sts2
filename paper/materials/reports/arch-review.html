<script type="text/markdown" id="md">## 一、对三份提案的批评

**三份都对的地方：**
- 战斗应该由 solver（出牌求解器）的“评估 + 搜索”来主导。开源里能打的 bot 都这么做；destire-mio 用网络替代搜索试了 6 次，全部失败。
- Jev 只在 solver 判为接近的几条线里挑；DS 退出逐回合出牌。依据是多掉的 HP：Jev 2.59，DS 3.12；DS 推翻 Jev 时平均多掉 1.7 HP，只多打 0.4 伤害。
- 经验只能以数据形式给 Jev（放在 state 或 question 里），不能塞整本手册。
- 只有 1–2 局证据的 D 类规则应该降级。

**一厢情愿的地方：**
- **Replay 只看“比 min-loss 多掉的 HP”会把系统往错的方向优化。** min-loss 是 solver 对单回合的估计。用它当唯一指标，等于奖励“少掉血、放弃成长”，JEGBU7 正是这样死的。三份提案的 M1 都只看这个数，必须改成综合指标：HP + 伤害 + 成长收益。
- **ΔHP 模拟选卡（B 为主，A 的 M4、C 的 M4 也用）现在做不到。** 当前 solver 只模拟到本回合敌人行动结束。整场模拟需要抽牌、多回合的敌人 AI，以及一堆还没建模的机制；而 34/45 的输局本来就出在未建模机制上。模拟不准，会把错误同时带进战斗和构筑。所以它只能放在最后一步，并且要先通过误差门槛（MAE ≤8）。
- **B 让 DS 输出评估权重，不可验证。** 对 A2 的约 13 局数据调权重，必然过拟合。C 的“有限枚举 + 人工预设”稍好，但预设本身也是新的死规则。fight_intent 每局要多约 12 次 DS 调用，收益没有任何证据，本轮不做。
- **A 的 M2 把 Jev 低置信时的兜底设成 code rank1，与数据相反。** 同一批回合里，Jev 单独多掉 1.61，code rank1 多掉 2.13。兜底应该是“Jev 的选择 + HP guard”（加 guard 后是 1.88），不是 rank1。
- **C 的知识库用“命中 20 次 + 失血差”判断条目好坏，在当前样本下测不出因果。** 150/60 的条目上限也没有依据。命中统计应该用来做淘汰，不能当作“有效”的证明。
- **“把选卡交给 DS 就能提升构筑”证据很弱。** 两次胜局都靠 DS 构筑，失控的也是 DS。A2 下 0/13，10 局的楼层标准差大约 10 层以上，看不出差别。所以只能逐步下放，并保留代码否决。
- **三份都没强调最大的杠杆仍是修 bug 和机制（34/45 输局来自这里）。** 架构迁移不能挤占每 5 局一次的修复循环。

## 1. 结论
- 采纳你的三层分工，但做四处修正。
- **出牌**的主人是 solver，Jev 只做接近线之间的裁决，DS 完全退出出牌（包括药水）。
- **DS** 负责方向（run_plan）以及构筑/商店/事件的接近选择；代码保留对明显坏选择的否决。
- **“跨局决策”**不交给局内的 DS，改由赛后复盘层离线写入经验库，局内按触发条件检索。
- **代码**只放机制、护栏和确定操作。策略类规则降级为“先验分”或“经验卡”，不再由代码直接拍板。

## 2. 分工表
| 决策 | 主导 | 其他层 | 依据 |
|---|---|---|---|
| 出牌顺序 | solver 枚举打分；差距 ≥6 时代码直接出 | Jev 裁决接近线；HP guard 否决；DS 不参与 | Jev 2.59 / DS 3.12 / rank1 3.67；DS 用 1.7 HP 换 0.4 伤害 |
| Jev 低置信（出牌） | Jev 的选择 + HP guard | 不再升级给 DS | Jev 1.61 vs rank1 2.13；加 guard 后 1.88 |
| 药水 | 代码（成本模型）+ Jev | DS 退出；满槽、Fruit Juice、危急时免费这类规则留在代码 | plan+potion 现在 64% 走 DS，正是它拿 HP 换伤害的地方 |
| 构筑方向与转向 | DS 在检查点输出 run_plan | 代码把 needs 转成选卡加分；每幕最多转向 1 次 | 两次胜局的关键构筑都来自 DS 推翻 Jev |
| 卡牌奖励 | 代码给出前 3 名 + 先验分；接近或“改变方向”的候选交给 DS | 代码否决卡组膨胀和缺 AOE | 现在 74% 由 tier 表拍板，是最大的死套路来源 |
| 商店 | DS 每店一次给出购物方案 | 代码校验金币、删卡顺序、丢垃圾药水 | 现状已有 45% 是 DS |
| 事件 | DS | 代码的 event HP guard 过滤危险选项 | 现状 77% 是 DS |
| 删卡 / 升级 | 代码 | 升级顺序读 run_plan 的核心卡，不再用固定列表 | 删卡顺序是确定的 |
| 地图 / 休息 | 代码打分，Jev 裁决接近选择 | 精英门槛由 run_plan 在限定范围内调节 | 324 次里 231 次只有一个选项 |
| Boss / 敌人战术 | 机制写进 solver；战术写成经验卡（给 Jev 和 DS） | 删掉 7 个 Boss 的选卡加分 | 这些加分各只有 1–2 局证据 |
| 跨局经验 | 赛后复盘子代理（离线） | 通过写入闸门写入经验库 | AgenticSTS：有赛后记忆的能到 A6–A8，没有的停在 A2–A4 |

## 3. 经验如何流动
| 类型 | 去处 | 进入条件 |
|---|---|---|
| 机制 / bug | 代码事实 + 一个 replay 回归用例 | 立即修 |
| 安全底线 | guard | 至少 2 局出现同一条致死路径 |
| 可量化的取舍 | solver 评估项（例如“成长收益 × 本场预计剩余回合”） | replay 综合指标变好，且留出一部分局不参与调参 |
| 依赖局面的经验 | 经验卡 `knowledge/*.jsonl`：触发键、25 词以内的正向条件句、来源局、audience、状态 | 默认去处；禁止新写“情况 X 就选 Y” |

- **经验卡升为代码：** 至少 3 局一致，replay 中没有反例，且不依赖局面。
- **只有单局证据的卡：** 只给 DS，不给 Jev。
- **退役：** 连续 10 局没触发，或者触发后采纳组与未采纳组没有差异，就退役。被新证据推翻时改版本，不叠加新条目。
- **JEGBU7 的冲突**（HP guard 和成长价值互相拉扯）：统一进评估函数里的同一种代价，不要再调 guard 阈值。

**先降级的规则**：从代码拍板改为给 DS 的先验分或经验卡。

| 规则 | 位置 | 证据 |
|---|---|---|
| 7 个 Boss 的选卡加分 | `strategy/card-value.ts:69-103` | 各 1–2 局 |
| 单局改分：Breakthrough 62、Armaments 48、Dark Embrace 需 3 张以上消耗卡、Baking Gloves +25 | `card-value.ts:16-41,189` | 各 1 局 |
| 固定的 need 加分 +12/+14/+5/+10 | `card-value.ts:158-181` | 改由 run_plan 的 needs 驱动 |
| 事件 max-HP 上限 8、F1–3 的 20% HP 线 | `screens/event.ts:23-46` | 各 1 局；保留 guard 的骨架，降级其中的数字 |
| 可选精英要求 HP >80%、Boss 前精英 >0.8、Act1 后段商店 +3 | `screens/map.ts:67-75,103` | 2 局；门槛改由 run_plan 在限定范围内调 |
| monsterWeight 在 50%/35% 以下的调整 | `screens/map.ts:245` | 仅 MD3F 一局 |
| 一场战斗至少保留 4 张攻击牌 | `screens/selection.ts:234` | 6A36 一局 |
| Boss 战药水成本 4、每回合 1 瓶 | `screens/combat-plan.ts:69-72,603-607` | 1R3C 一局 |

**保留在代码里：** 连续战斗惩罚（3 局证据）、Inflame 74（有胜负统计支持）、Knowledge Demon 的诅咒顺序（接近机制）、全部 A/B 类规则。

## 4. Jev 能否获得经验
能，但只能以数据形式进入：`systemOne({model, state, questions})` 没有 system 字段，也不能微调。成本可以忽略：输入从 1k 到 3k token 时延迟都在约 530ms，多 300 token 每次约 $0.00001。按效果从高到低，具体这样做：
1. **在每个选项上加代码算好的事实标签。** 位置是 `combat-plan.ts:741` 的 describePlan，标签包括 `hp_after`、`hp_after_pct`、`dmg`、`lethal_now`、`enemy_threat_next`、`setup_turn`（敌人不攻击且本线打出能力牌）、`scaling_gained`、`block_wasted`。Jev 只照字面理解，所以判断在代码里做完，再以事实交给它。
2. **在 state 里加 `fight_hints`**（`combat-plan.ts:791` 附近）。按敌人 id、战斗类型、act、HP 区间检索，最多 5 条，每条最多 25 词，每条写明条件。只放多局证据的卡。
3. **精简 combat state。** 去掉 run_brief 里的整份卡组和遗物列表（`project/run-brief.ts:68-81`），只保留战斗中会生效的遗物。官方文档说无关内容会降低 Jev 的准确率。
4. **instructions 改成一两句 JSON 目标。** 不写“优先打能力牌”这类会在斩杀回合被误用的泛化规则。

不要给 Jev：整本手册（约 8–9k token）、多步计划、需要它自己计数的规则。

## 5. 迁移路线（每步只改一层；决策日志记录 source、经验卡 id 和 run_plan 版本）
| 步骤 | 内容 | A/B 指标 | 停止 / 回滚条件 |
|---|---|---|---|
| M0 | 先跑完进行中的 DS memory v1（10 局）作为基线。同时给 replay 加综合指标：多掉的 HP、伤害、成长收益 | 记录基线：平均层数；精英 / Boss / 普通战的每场掉血；DS 每局耗时 | 10 局跑完前不改任何代码路径 |
| M1 | Jev 选项标签 + fight_hints + 精简 state。先离线三组对比（基线 / 只加标签 / 标签 + 提示），再上线 5 局 | 离线：多掉的 HP ≤2.3，且伤害和成长不降；置信度分布变化后重新校准升级阈值 | 综合指标没有改善，或升级率漂移超过 5pp 且重新校准后仍不稳定 |
| M2 | DS 退出出牌 plan-choice(+potion)；低置信时由 Jev + guard 兜底 | 每场掉血（按精英 / Boss 分）不变差；DS 每局省 2.5 分钟以上 | 精英 / Boss 平均掉血恶化超过 15%，或出现一次囤药致死 |
| M3 | DS 在 Neow、约第 6 层、每个 Boss 之后输出 run_plan，替换固定 need 加分 | 离线抽查计划与选牌的一致性；平均层数不低于基线 −2 | 楼层降超过 3，或 DS 在一幕内反复转向 |
| M4 | 降级上面的规则表；选卡的代码拍板差距对“改变方向”的候选放宽；代码否决保留 | 平均层数；Act2 通过率；卡组大小分布 | 楼层降超过 3，或卡组膨胀到 26 张以上的局增多 |
| M5（有门槛） | 整场战斗模拟器 → ΔHP 卡值，先只写进日志和 DS 的 state | 对已记录战斗的预测 MAE ≤8 才能作为特征使用 | 达不到门槛就不上线 |

## 6. 风险与未知
- **样本太小。** A2 下 10 局只能看出约 10 层的差距。要用交替的 A/B 局、以单场战斗和单个决策为单位的指标，胜率只作最终验收。
- **replay 指标本身有偏。** min-loss 是单回合估计。综合指标里成长收益的权重是新的人为参数，需要留出一部分局不参与调参。
- **DS 构筑方差仍然大。** run_plan 可能不稳定，或被 DS 自己忽视。靠转向冷却和代码否决约束；DS 的提示和经验卡只在 DS 自己身上做 A/B（AgenticSTS 里为别的模型写的 skills 在 DeepSeek V4-Pro 上 −18%）。
- **Jev 是否真的会权衡文字提示还没验证。** 标签比提示更可靠，所以 M1 分组测试。
- **经验库可能膨胀成文字版的死套路。** 靠写入闸门和退役机制控制，每次调用最多 5 条。
- **迁移可能挤占修 bug 的时间。** 34/45 输局来自 bug 和未建模机制，每 5 局一次的修复循环要继续。
- **降级规则会让代码侧的选卡变“软”。** 短期楼层可能下降，这是在用确定性换灵活性，每步都要能单独回滚。</script>
